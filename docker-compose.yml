services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: diplomovka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bakalarka
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:bakalarka@db:5432/postgres

  frontend:
    build: ./frontend/vite-project
    volumes:
      - ./frontend/vite-project:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "5173:80"   # host 5173 → container 80 (vite dev server)
    depends_on:
      - backend

volumes:
  pgdata:
